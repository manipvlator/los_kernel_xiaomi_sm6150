name: Tracking

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  tracker:
    name: Create Telegram Tracker
    runs-on: ubuntu-latest
    outputs:
      message_id: ${{ steps.telegram.outputs.message_id }}
      build_time: ${{ steps.time.outputs.build_time }}
    steps:
      - name: 🕒 Generate Build Time
        id: time
        run: echo "build_time=$(TZ=Asia/Jakarta date +'%d%m%Y-%H%M')" >> "$GITHUB_OUTPUT"

      - name: 📡 Create Telegram Tracker
        id: telegram
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          NEVER_DIE_ID: ${{ secrets.NEVER_DIE_ID }}
          BUILD_TIME: ${{ steps.time.outputs.build_time }}
        run: |
          esc() { sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g'; }
          nb() { sed 's/^\([^ ]*\) /\1\&nbsp;/'; }
          zw() { sed 's/\([-_]\)/\1\xe2\x80\x8b/g'; }
          row() { printf '<tr><th align="left">%s</th><td>%s</td></tr>' "$(nb <<< "$1")" "$(esc <<< "$2" | nb | zw)"; }
          lbl() { local s="$1" n="${2:-0}" i; for ((i=0; i<n; i++)); do s+="&nbsp;"; done; printf '%s' "$s"; }
          render() {
            local h
            h="<table bordered><tr><th colspan=\"2\" align=\"center\">⚡ StriXotic-Limited</th></tr>"
            h+="$(row "$(lbl "KSU-AOSP" 0)" "$1")$(row "$(lbl "Non-KSU" 0)" "$2")"
            h+="</table>"
            h+="<table bordered>$(row "Branch" "${GITHUB_REF_NAME}")$(row "Build" "#${BUILD_TIME}")$(row "Run" "#${GITHUB_RUN_NUMBER}")</table>"
            printf '%s' "$h"
          }
          rich() { jq -nc --arg h "$1" '{html:$h, skip_entity_detection:true}'; }

          TEXT="$(render "⏳ Waiting" "⏳ Waiting")"

          R="$(curl -fsS -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendRichMessage" \
            --data-urlencode "chat_id=${NEVER_DIE_ID}" \
            --data-urlencode "rich_message=$(rich "$TEXT")")"

          ID="$(echo "$R" | jq -r '.result.message_id // empty')"
          [ -n "$ID" ] || { echo "$R"; exit 1; }
          echo "message_id=$ID" >> "$GITHUB_OUTPUT"

  telegram-live:
    name: Telegram Live Tracker
    runs-on: ubuntu-latest
    needs: tracker
    env:
      TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
      NEVER_DIE_ID: ${{ secrets.NEVER_DIE_ID }}
      MESSAGE_ID: ${{ needs.tracker.outputs.message_id }}
      BUILD_TIME: ${{ needs.tracker.outputs.build_time }}
    steps:
      - name: 📡 Live Tracking
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100"
          LAST=""

          DL="https://sourceforge.net/projects/dirty-project/files/StriXotic-Limited/${BUILD_TIME}/"

          duration() {
            local s="$1"
            [ "$s" -lt 0 ] && s=0
            if [ "$s" -lt 60 ]; then
              echo "${s}s"
            elif [ "$s" -lt 3600 ]; then
              printf '%dm %02ds\n' $((s/60)) $((s%60))
            else
              printf '%dh %02dm %02ds\n' $((s/3600)) $(((s%3600)/60)) $((s%60))
            fi
          }

          trunc() {
            local t="$1" m="${2:-25}"
            if [ "${#t}" -gt "$m" ]; then printf '%s...' "${t:0:$((m-3))}"; else printf '%s' "$t"; fi
          }

          step() {
            local j="$1" s c n t start now elapsed

            [ -z "$j" ] || [ "$j" = "null" ] && { echo "⏳ Waiting"; return; }

            s="$(jq -r '.status' <<< "$j")"
            c="$(jq -r '.conclusion // empty' <<< "$j")"

            if [ "$s" = completed ]; then
              if [ "$c" = success ]; then
                echo "✅ Done"
              else
                n="$(jq -r '.steps[] | select(.conclusion=="failure") | .name' <<< "$j" | head -1 | sed 's/[^ -~]//g; s/^ *//')"
                echo "❌ $(trunc "${n:-Failed}" 19)"
              fi
              return
            fi

            [ "$s" = queued ] && { echo "⏳ Waiting"; return; }

            if [ "$s" = in_progress ]; then
              n="$(jq -r '.steps[] | select(.status=="in_progress") | .name' <<< "$j" | head -1 | sed 's/[^ -~]//g; s/^ *//')"
              [ -n "$n" ] || { echo "Starting..."; return; }

              t="$(jq -r '.steps[] | select(.status=="in_progress") | .started_at' <<< "$j" | head -1)"
              start="$(date -d "$t" +%s 2>/dev/null || echo 0)"
              now="$(date -u +%s)"
              elapsed=$((now-start))
              echo "$(trunc "$(duration "$elapsed") $n" 25)"
              return
            fi

            echo "⏳ Waiting"
          }

          esc() { sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g'; }
          nb() { sed 's/^\([^ ]*\) /\1\&nbsp;/'; }
          zw() { sed 's/\([-_]\)/\1\xe2\x80\x8b/g'; }
          row() { printf '<tr><th align="left">%s</th><td>%s</td></tr>' "$(nb <<< "$1")" "$(esc <<< "$2" | nb | zw)"; }
          lbl() { local s="$1" n="${2:-0}" i; for ((i=0; i<n; i++)); do s+="&nbsp;"; done; printf '%s' "$s"; }

          btns() {
            local b=""
            b+='<tg-button-row><tg-button type="url" url="'$(printf '%s' "$DL" | sed 's/"/&quot;/g')'" style="success">⬇ Download</tg-button></tg-button-row>'
            b+='<tg-button-row><tg-button type="url" url="https://t.me/KernelSU_group/3234" style="secondary">KSU Official</tg-button><tg-button type="url" url="https://t.me/ksunext_ci" style="secondary">KernelSU-Next</tg-button></tg-button-row>'
            b+='<tg-button-row><tg-button type="url" url="https://t.me/kowsu_build" style="secondary">KowSU</tg-button><tg-button type="url" url="https://t.me/WebsArch" style="secondary">MamboSU</tg-button></tg-button-row>'
            b+='<tg-button-row><tg-button type="url" url="https://github.com/backslashxx/KernelSU/releases" style="secondary">xxKSU</tg-button><tg-button type="url" url="https://t.me/BakaSU_Grp/4" style="secondary">BakaSU</tg-button></tg-button-row>'
            b+='<tg-button-row><tg-button type="url" url="https://github.com/midori01/KernelSU/releases" style="secondary">midoriSU</tg-button><tg-button type="url" url="https://t.me/FinaSU" style="secondary">FinaSU</tg-button></tg-button-row>'
            b+='<tg-button-row><tg-button type="url" url="https://t.me/KazeKSU/2" style="secondary">KazeSU</tg-button><tg-button type="url" url="https://t.me/Sukiksu/7114" style="secondary">SukiSU</tg-button></tg-button-row>'
            printf '%s' "$b"
          }

          render() {
            local h
            h="<table bordered><tr><th colspan=\"2\" align=\"center\">⚡ StriXotic-Limited</th></tr>"
            h+="$(row "$(lbl "KSU-AOSP" 0)" "$1")$(row "$(lbl "Non-KSU" 0)" "$2")"
            if [ -n "${3:-}" ]; then h+="$(row "Status" "$3")"; fi
            h+="</table>"
            h+="<table bordered>$(row "Branch" "${GITHUB_REF_NAME}")$(row "Build" "#${BUILD_TIME}")$(row "Run" "#${GITHUB_RUN_NUMBER}")</table>"
            if [ "${4:-}" = "1" ]; then h+="$(btns)"; fi
            printf '%s' "$h"
          }

          rich() { jq -nc --arg h "$1" '{html:$h, skip_entity_detection:true}'; }

          update() {
            local text="$1" r d key

            key="${text}"
            [ "$key" = "$LAST" ] && return 0

            r="$(curl -sS -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/editMessageText" \
              --data-urlencode "chat_id=${NEVER_DIE_ID}" \
              --data-urlencode "message_id=${MESSAGE_ID}" \
              --data-urlencode "rich_message=$(rich "$text")")"

            d="$(jq -r '.description // empty' <<< "$r" 2>/dev/null || true)"
            if [ "$(jq -r '.ok // false' <<< "$r" 2>/dev/null || echo false)" != true ] &&
               [[ "$d" != *"message is not modified"* ]]; then
              echo "Telegram update failed: $d"
              return 1
            fi
            LAST="$key"
          }

          while true; do
            JOBS="$(curl -fsS \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" "$API")"

            KSU="$(jq -c '.jobs[] | select(.name=="Reforging - KSU-AOSP")' <<< "$JOBS" | head -1)"
            NON="$(jq -c '.jobs[] | select(.name=="Reforging - Non-KSU")' <<< "$JOBS" | head -1)"

            KSUS="$(step "$KSU")"
            NONS="$(step "$NON")"

            KC="$(jq -r '.conclusion // empty' <<< "$KSU")"
            NC="$(jq -r '.conclusion // empty' <<< "$NON")"

            if [ "$KC" = success ] && [ "$NC" = success ]; then
              TEXT="$(render "$KSUS" "$NONS" "✅ All builds completed successfully." "1")"
              update "$TEXT" || true
              exit 0
            fi

            if [ -n "$KC" ] && [ -n "$NC" ]; then
              if [[ "$KC" =~ ^(failure|cancelled|timed_out)$ ]] ||
                 [[ "$NC" =~ ^(failure|cancelled|timed_out)$ ]]; then
                TEXT="$(render "$KSUS" "$NONS" "❌ One or more builds failed.")"
                update "$TEXT" || true
                exit 0
              fi
            fi

            TEXT="$(render "$KSUS" "$NONS")"
            update "$TEXT" || true
            sleep 7
          done

  Reforging:
    name: Reforging - ${{ matrix.build_type }}
    runs-on: ubuntu-24.04
    needs: tracker
    strategy:
      fail-fast: false
      matrix:
        build_type: [KSU-AOSP, Non-KSU]

    env:
      KBUILD_BUILD_USER: Manipulator
      KBUILD_BUILD_HOST: ExoticGANK
      SOURCEFORGE_PROJECT: ${{ secrets.SOURCEFORGE_PROJECT }}
      SOURCEFORGE_USERNAME: ${{ secrets.SOURCEFORGE_USERNAME }}
      BUILD_TIME: ${{ needs.tracker.outputs.build_time }}

    steps:
      - name: 📥 Checkout Kernel
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 📦 Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison cpio flex aria2 lz4 libssl-dev libxml2 patchelf rsync openssh-client zip unzip

      - name: 🔐 Setup SourceForge SSH
        env:
          SOURCEFORGE_SSH_KEY: ${{ secrets.SOURCEFORGE_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SOURCEFORGE_SSH_KEY" > ~/.ssh/sourceforge_actions
          chmod 600 ~/.ssh/sourceforge_actions
          ssh-keyscan -H frs.sourceforge.net >> ~/.ssh/known_hosts

      - name: ⚙️ Setup ZyC Clang
        run: |
          mkdir -p clang && cd clang
          wget https://github.com/ZyCromerZ/Clang/releases/download/17.0.0-20230725-release/Clang-17.0.0-20230725.tar.gz
          tar -xzf Clang-17.0.0-20230725.tar.gz
          rm Clang-17.0.0-20230725.tar.gz

      - name: ⚙️ Setup GCC
        run: |
          git clone --depth=1 --branch main https://github.com/greenforce-project/gcc-arm64 gcc64
          git clone --depth=1 --branch main https://github.com/greenforce-project/gcc-arm gcc32

      - name: 🔐 Setup KernelSU + NoMount
        if: matrix.build_type == 'KSU-AOSP'
        run: |
          curl -LSs https://raw.githubusercontent.com/manipvlator/KernelSU/refs/heads/main/kernel/setup.sh | bash -s main
          curl -LSs https://raw.githubusercontent.com/maxsteeel/nomount/refs/heads/master/kernel/setup.sh | bash -s master

      - name: 🧩 Generate Defconfig
        run: make O=out ARCH=arm64 vendor/sweet_defconfig

      - name: 🔨 Build Kernel
        run: |
          CLANG="$GITHUB_WORKSPACE/clang"
          GCC64="${GITHUB_WORKSPACE}/gcc64"
          GCC32="${GITHUB_WORKSPACE}/gcc32"
          export PATH="$CLANG/bin:$GCC64/bin:$GCC32/bin:$PATH"
          export CFLAGS_EXTRA="-DBUILD_DATE=$(date +%s)"

          make -j"$(nproc --all)" O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 CC=clang LD=ld.lld \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE="$GCC64/bin/aarch64-elf-" \
            CROSS_COMPILE_ARM32="$GCC32/bin/arm-eabi-" \
            KBUILD_BUILD_USER="$KBUILD_BUILD_USER" \
            KBUILD_BUILD_HOST="$KBUILD_BUILD_HOST" \
            KBUILD_COMPILER_STRING="$CLANG/bin/clang"

      - name: 📄 Save Defconfig
        run: cp out/.config out/sweet_defconfig.txt

      - name: 📦 Build 90Hz DTBO
        run: |
          cp out/arch/arm64/boot/dtb.img "$RUNNER_TEMP/dtb-stock.img"
          cp out/arch/arm64/boot/dtbo.img "$RUNNER_TEMP/dtbo-stock.img"

          git apply arch/arm64/boot/dts/qcom/90hz-dtbo.patch
          rm -rf out/arch/arm64/boot/dts out/arch/arm64/boot/dtb.img out/arch/arm64/boot/dtbo.img

          CLANG="$GITHUB_WORKSPACE/clang"
          GCC64="${GITHUB_WORKSPACE}/gcc64"
          GCC32="${GITHUB_WORKSPACE}/gcc32"
          export PATH="$CLANG/bin:$GCC64/bin:$GCC32/bin:$PATH"
          export CFLAGS_EXTRA="-DBUILD_DATE=$(date +%s)"

          make -j"$(nproc --all)" O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 CC=clang LD=ld.lld \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE="$GCC64/bin/aarch64-elf-" \
            CROSS_COMPILE_ARM32="$GCC32/bin/arm-eabi-" \
            KBUILD_BUILD_USER="$KBUILD_BUILD_USER" \
            KBUILD_BUILD_HOST="$KBUILD_BUILD_HOST" \
            KBUILD_COMPILER_STRING="$CLANG/bin/clang"

          cp out/arch/arm64/boot/dtbo.img "$RUNNER_TEMP/dtbo-90hz.img"
          cp "$RUNNER_TEMP/dtb-stock.img" out/arch/arm64/boot/dtb.img
          cp "$RUNNER_TEMP/dtbo-stock.img" out/arch/arm64/boot/dtbo.img
          git apply -R arch/arm64/boot/dts/qcom/90hz-dtbo.patch

      - name: 📦 Prepare AnyKernel3
        run: |
          git clone --depth=1 --branch strix https://github.com/manipvlator/Anykernel3.git AnyKernel3
          cp out/arch/arm64/boot/{Image.gz,dtbo.img,dtb.img} AnyKernel3/
          cp "$RUNNER_TEMP/dtbo-90hz.img" AnyKernel3/dtbo-90hz.img

      - name: 🗜️ Create Flashable ZIP
        run: |
          ZIP_NAME="StriXotic-Limited_${{ matrix.build_type }}-${{ github.ref_name }}-${BUILD_TIME}.zip"
          echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_ENV"
          (cd AnyKernel3 && zip -r9 "../$ZIP_NAME" . -x ".git/*")

      - name: 📤 Upload ZIP Artifact
        uses: actions/upload-artifact@v7
        with:
          name: StriXotic-Limited_${{ matrix.build_type }}-${{ github.ref_name }}-${{ env.BUILD_TIME }}
          path: AnyKernel3/*

      - name: 📤 Upload Defconfig Artifact
        uses: actions/upload-artifact@v7
        with:
          name: configs-${{ matrix.build_type }}-${{ env.BUILD_TIME }}
          path: out/sweet_defconfig.txt

      - name: 🚀 Upload ZIP to SourceForge
        run: |
          BASE="/home/frs/project/${SOURCEFORGE_PROJECT}/StriXotic-Limited"
          PATH_SF="${BASE}/${BUILD_TIME}"

          sftp -i ~/.ssh/sourceforge_actions -oBatchMode=yes -oStrictHostKeyChecking=yes \
            "${SOURCEFORGE_USERNAME}@frs.sourceforge.net" <<EOF
          -mkdir ${BASE}
          -mkdir ${PATH_SF}
          bye
          EOF

          sftp -i ~/.ssh/sourceforge_actions -oBatchMode=yes -oStrictHostKeyChecking=yes \
            "${SOURCEFORGE_USERNAME}@frs.sourceforge.net" <<EOF
          cd ${PATH_SF}
          put ${ZIP_NAME}
          bye
          EOF

  final:
    name: Final
    runs-on: ubuntu-latest
    needs: [tracker, Reforging, telegram-live]
    if: always()
    steps:
      - name: 📊 Final Status
        run: |
          echo "StriXotic-Limited FINAL STATUS"
          echo "Tracker       : ${{ needs.tracker.result }}"
          echo "Reforging     : ${{ needs.Reforging.result }}"
          echo "Telegram Live : ${{ needs.telegram-live.result }}"
